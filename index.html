<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HallSim by Diodes Incorporated — interactive Hall-effect sensor and magnet field simulator for evaluating Diodes linear and digital sensors."
    />
    <title>HallSim · Diodes Incorporated</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('hallsim-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
